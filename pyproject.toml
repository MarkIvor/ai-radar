[project]
name = "ai-radar"
version = "0.1.0"
description = "AI Radar — двухсигнальная автономная система детекции ИИ-контента и академической честности с AI Semantic Judge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AI Radar Contributors" }]
keywords = [
    "ai-detection",
    "academic-integrity",
    "llm-judge",
    "perplexity",
    "burstiness",
    "fastapi",
    "open-source",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Topic :: Education",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "spacy>=3.7",
    "nltk>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio>=4.3",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/your-org/ai-radar"
Documentation = "https://github.com/your-org/ai-radar#readme"
Issues = "https://github.com/your-org/ai-radar/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
